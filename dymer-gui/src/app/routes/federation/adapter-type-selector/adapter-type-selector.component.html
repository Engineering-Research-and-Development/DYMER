<div class="adapter-selector" role="radiogroup" aria-label="Tipo di adapter">
    @for (option of options; track option.value) {
    <button type="button" class="adapter-card" [class.adapter-card--selected]="value === option.value"
        [class.adapter-card--disabled]="!option.available" [disabled]="!option.available || disabled()"
        (click)="select(option.value)">
        <span class="adapter-card__label">{{ option.label }}</span>
        <span class="adapter-card__description">{{ option.description }}</span>
        @if (!option.available) {
        <span class="adapter-card__badge">Prossimamente</span>
        }
    </button>
    }
</div>
