
<div class="mt-6 bg-white dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-3xl overflow-hidden shadow-sm animate-in fade-in slide-in-from-bottom-2 duration-500">
  
  <header class="flex items-center justify-between px-6 py-4 border-b border-zinc-100 dark:border-zinc-900 bg-zinc-50/50 dark:bg-zinc-900/20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-amber-100 dark:bg-amber-950/30 flex items-center justify-center text-amber-600">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-8-8-5 5"/><path d="M13 13v8H5v-8h8Z"/><path d="M21 3H3v18h18V3Z"/></svg>
      </div>
      <div>
        <h2 class="text-[11px] font-bold text-zinc-900 dark:text-zinc-100 uppercase tracking-[0.2em]">
          {{ 'menu.query_builder.title.sql' | translate }}
        </h2>
        <p class="text-[9px] font-medium text-zinc-400 uppercase tracking-tighter">
          {{ 'menu.query_builder.title.entity_search' | translate }}
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="btn-reset" 
              class="flex items-center gap-2 px-3 py-1.5 text-[10px] font-bold uppercase tracking-widest text-zinc-400 hover:text-red-500 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        {{ 'menu.query_builder.buttons.reset' | translate }}
      </button>
    </div>
  </header>

  <div class="p-6 space-y-6">
    
    <div class="bg-zinc-50/30 dark:bg-zinc-900/10 border border-zinc-100 dark:border-zinc-800 rounded-2xl p-4">
      <div id="builder" class="query-builder-custom"></div>
    </div>

    <div class="flex items-center justify-between pt-4 border-t border-zinc-100 dark:border-zinc-900">
      
      <span class="text-[10px] font-mono text-zinc-400">Rules status: Ready to parse</span>

      <div class="flex items-center gap-3">
        <button id="btn-test" 
                class="h-10 px-6 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-900 dark:text-zinc-100 text-[10px] font-bold uppercase tracking-widest rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-all flex items-center gap-2 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          {{ 'menu.query_builder.buttons.test_rules' | translate }}
        </button>

        <button id="btn-get" 
                class="h-10 px-8 bg-zinc-900 dark:bg-white text-white dark:text-black text-[10px] font-bold uppercase tracking-widest rounded-xl hover:opacity-90 transition-all flex items-center gap-2 shadow-lg">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5V3"/><path d="M7 14h12v7H7z"/></svg>
          {{ 'menu.query_builder.buttons.get_rules' | translate }}
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 animate-in fade-in duration-700">
      <div id="queryResult" class="empty:hidden p-4 bg-zinc-900 rounded-2xl text-emerald-400 font-mono text-xs overflow-x-auto border border-zinc-800"></div>
      <div id="renderqueryResult" class="empty:hidden p-4 bg-zinc-50 dark:bg-zinc-900/50 rounded-2xl border border-zinc-200 dark:border-zinc-800 text-xs"></div>
    </div>

  </div>
</div>
